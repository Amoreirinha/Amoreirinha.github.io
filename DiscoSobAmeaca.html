const LEARN={A:"<h3>Saiba mais · xv6</h3><p>O xv6 usa alocação <b>indexada</b>: o inode guarda ponteiros diretos e indiretos, e <code>bmap()</code> em <code>fs.c</code> traduz o número do bloco lógico para o bloco físico.</p>",
B:"<h3>Saiba mais · xv6</h3><p>Veja <code>kernel/log.c</code>: <code>write_log()</code> copia para o log, <code>commit()</code> grava o cabeçalho e <code>recover_from_log()</code> reaplica no boot. O <code>bio.c</code> (buffer cache) faz a ponte com o disco.</p><p>O log é uma área reservada: só depois do commit os dados vão para o lugar definitivo. <code>begin_op/end_op</code> delimitam a transação.</p>",
S:"<h3>Saiba mais · xv6</h3><p>Escolha a estratégia, ligue ou desligue o log e simule quedas a qualquer momento. Sem log, uma queda no meio de uma escrita deixa blocos inconsistentes.</p><p>Indexada: <code>bmap()</code> em <code>fs.c</code>. Log: <code>log.c</code>.</p>"};
let D,MODE,A,B,S,resA=null,resB=null,timer=null;
const clone=d=>d.map(b=>({...b})),sl=ms=>new Promise(r=>setTimeout(r,ms));
const blank=i=>({id:i,estado:i>=LOG0?"log":"livre",dono:null,usado:false});
function newDisk(pre){D=Array.from({length:N},(_,i)=>blank(i));if(pre)[3,4,8,9,10,15,16,20,21,25].forEach(i=>{D[i].estado="dados";D[i].dono="sistema"})}
function drawDisk(el,d,hl=[]){el.innerHTML=d.map(b=>`<div class="b ${b.estado}${b.usado?" on":""}${hl.includes(b.id)?" sel":""}" title="${b.dono||"livre"}" style="--i:${b.id}"><i>${b.id}</i><span>${b.dono?b.dono[0].toUpperCase():""}</span></div>`).join("")}
const render=(hl=[])=>drawDisk($("disk"),D,hl);
const say=t=>{const e=$("banner");e.textContent=t;e.classList.remove("pop");void e.offsetWidth;e.classList.add("pop")};
function petals(n=18){for(let i=0;i<n;i++){const p=document.createElement("i");p.className="petal";p.style.cssText=`left:${Math.random()*100}vw;--dx:${Math.random()*160-80}px;animation-duration:${3+Math.random()*2.5}s;animation-delay:${Math.random()*.8}s;background:${["#ff4f7b","#3fc23c","#7b68ff","#ffd21f"][i%4]}`;document.body.appendChild(p);setTimeout(()=>p.remove(),6500)}}
const show=id=>{["menu","game","result"].forEach(x=>$(x).hidden=x!==id);setTimeout(()=>$("tk").textContent={menu:"Menu principal",game:"💽 "+$("gtitle").textContent,result:"Resultado"}[id])};
const scoreUI=()=>{const e=$("score"),t=MODE==="A"?"Pontos: "+A.score:MODE==="B"?"Pontos: "+B.score:"";if(e.textContent!==t){e.textContent=t;e.classList.remove("bump");void e.offsetWidth;e.classList.add("bump")}};
function modal(html,btns=[{t:"Fechar"}]){$("mbox").innerHTML=html+`<div class="row">${btns.map((b,i)=>`<button class="${b.c||""}" data-i="${i}">${b.t}</button>`).join("")}</div>`;$("modal").hidden=false;$("mbox").querySelectorAll("button").forEach(el=>el.onclick=()=>{$("modal").hidden=true;const f=btns[el.dataset.i].f;f&&f()})}
const ask=(m,f)=>modal(`<p>${m}</p>`,[{t:"Cancelar"},{t:"Confirmar",c:"pri",f}]);
function help(){modal(`<h3>Como jogar</h3><p><b>Modo A:</b> escolha uma estratégia e aloque arquivos bloco a bloco. No fim, estime quantos acessos ao disco são necessários para ler o último bloco de foto.jpg.</p><p><b>Modo B:</b> registre as 3 suboperações no log, faça o commit e decida quando a energia cai. Teste também sem log.</p><p><b>Modo Livre:</b> aloque arquivos e simule quedas à vontade.</p><p class="mt">Cores: cinza = livre, azul = dados, roxo = índice, amarelo = log, vermelho = corrompido. A letra no bloco é a inicial do dono.</p>`)}
function toMenu(){stopAuto();show("menu")}
function goGame(t){show("game");const dk=$("disk");dk.classList.add("enter");setTimeout(()=>dk.classList.remove("enter"),1400);$("gtitle").textContent=t;$("learn").innerHTML=LEARN[MODE];render();scoreUI();window.scrollTo(0,0)}
const tick=()=>{$("clock").textContent=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})};tick();setInterval(tick,15000);
function startMenu(){modal("<h3>Iniciar</h3>",[{t:"Modo A: Alocação",f:startA},{t:"Modo B: Journaling",f:startB},{t:"Modo Livre",f:startS},{t:"Resultado",f:showResult},{t:"Como jogar",f:help},{t:"Fechar"}])}
/* ---------- alocação (compartilhada) ---------- */
function plan(s,n){const fr=D.filter(b=>b.estado==="livre"&&b.id<LOG0).map(b=>b.id);
 if(s==="contigua"){for(let i=0;i+n<=LOG0;i++){let ok=true;for(let j=0;j<n;j++)if(D[i+j].estado!=="livre"){ok=false;i+=j;break}if(ok)return{blocks:Array.from({length:n},(_,j)=>i+j)}}return null}
 if(s==="encadeada")return fr.length>=n?{blocks:fr.slice(0,n)}:null;
 return fr.length>=n+1?{idx:fr[0],blocks:fr.slice(1,n+1)}:null}
function stepsFor(s,nome,p){const bl=p.blocks,n=bl.length,st=[];
 if(s==="indexada")st.push({b:p.idx,tipo:"idx",msg:`${nome}: bloco ${p.idx} reservado como bloco de índices.`});
 bl.forEach((b,k)=>{let m;
  if(s==="contigua")m=k===0?`${nome}: precisa de ${n} blocos consecutivos → encontrados em ${bl[0]}–${bl[n-1]}. Bloco ${b} alocado.`:`${nome}: bloco ${b} alocado (${k+1}/${n}).`;
  else if(s==="encadeada")m=k<n-1?`${nome}: bloco ${b} → ponteiro para ${bl[k+1]}.`:`${nome}: bloco ${b} → fim do arquivo (ponteiro nulo).`;
  else m=`${nome}: bloco de índices em ${p.idx} aponta para ${bl.slice(0,k+1).join(", ")}.`;
  st.push({b,tipo:"dado",msg:m})});return st}
const apply=(x,nome)=>D[x.b]={id:x.b,estado:x.tipo==="idx"?"indice":"dados",dono:nome,usado:false};
function defrag(files){const old=D.slice(0,LOG0).filter(b=>b.estado!=="livre").map(b=>({...b})),map={};
 for(let i=0;i<LOG0;i++)D[i]=blank(i);old.forEach((b,i)=>{map[b.id]=i;D[i]={...b,id:i}});
 files.forEach(f=>{f.blocks=f.blocks.map(x=>map[x]);if(f.idx!=null)f.idx=map[f.idx]})}
const cost=(s,n)=>s==="contigua"?1:s==="encadeada"?n:2;
/* ---------- MODO A ---------- */
function startA(){stopAuto();newDisk(true);MODE="A";A={strat:null,queue:[{nome:"relatorio.txt",n:3},{nome:"foto.jpg",n:5},{nome:"log.txt",n:2},{nome:"video.mp4",n:4}],qi:0,cur:null,files:[],score:0,phase:"alloc",defrag:false,stuck:false,answered:false};goGame("Modo A · Alocação");say("Escolha uma estratégia para começar.");panelA()}
function pickA(s){A.strat=s;say(DICA[s]);panelA()}
function panelA(){const p=$("panel");
 if(!A.strat){p.innerHTML=`<h3>Escolha a estratégia</h3><div class="row">${Object.keys(NOME).map(s=>`<button class="pri" onclick="pickA('${s}')">${NOME[s]}</button>`).join("")}</div><p class="mt">Fila: ${A.queue.map(f=>f.nome+" ("+f.n+")").join(", ")}. Os blocos cinza-azulados com “S” já pertencem ao sistema.</p>`;return}
 const f=A.queue[A.qi];
 if(A.phase==="alloc"){p.innerHTML=`<h3>Estratégia: ${NOME[A.strat]}</h3><p>Arquivo atual: <b>${A.cur?A.cur.nome:f.nome}</b> (${(A.cur||f).n} blocos) · ${A.qi}/${A.queue.length} concluídos</p><div class="row"><button class="pri" onclick="nxtA()">Alocar próximo bloco</button><button onclick="autoA()">${timer?"Pausar":"Automático"}</button><button onclick="defragA()" ${A.stuck?"":"hidden"}>Desfragmentar</button><button onclick="rstA()">Reiniciar</button></div><p class="mt">${DICA[A.strat]}</p>`}
 else if(A.phase==="challenge"){const foto=A.files.find(x=>x.nome==="foto.jpg");p.innerHTML=`<h3>Desafio final</h3><p>Quantos acessos ao disco são necessários para ler o <b>último</b> bloco de foto.jpg (${foto.n} blocos, ${NOME[A.strat].toLowerCase()})?</p><div class="row"><input id="gs" type="number" min="1" max="20" inputmode="numeric" style="width:90px"><button class="pri" onclick="guessA()">Responder</button></div>`;render(foto.blocks.concat(foto.idx??[]))}
 else p.innerHTML=`<h3>Modo A concluído</h3><p>Pontuação: <b>${A.score}</b>.</p><div class="row"><button class="pri" onclick="showResult()">Ver resultado</button><button onclick="startA()">Jogar de novo</button></div>`}
function nxtA(){if(A.phase!=="alloc")return;
 if(!A.cur){const f=A.queue[A.qi],p=plan(A.strat,f.n);
  if(!p){stopAuto();A.stuck=A.strat==="contigua";say(`“${f.nome}” (${f.n} blocos) não cabe: ${A.strat==="contigua"?"não há "+f.n+" blocos consecutivos livres (fragmentação externa). Desfragmente e tente de novo.":"não há blocos livres suficientes."}`);panelA();return}
  A.cur={...f,p,steps:stepsFor(A.strat,f.nome,p),si:0}}
 const c=A.cur,s=c.steps[c.si++];apply(s,c.nome);render([s.b]);let m=s.msg;
 if(c.si>=c.steps.length){A.files.push({nome:c.nome,n:c.n,blocks:c.p.blocks,idx:c.p.idx});A.score+=10+(A.defrag?0:10);A.cur=null;A.qi++;A.stuck=false;m+=" ✔ Arquivo concluído.";
  if(A.qi>=A.queue.length){stopAuto();A.phase="challenge"}}
 say(m);scoreUI();panelA()}
function autoA(){if(timer)stopAuto();else{timer=setInterval(nxtA,900);nxtA()}panelA()}
function stopAuto(){clearInterval(timer);timer=null}
function defragA(){defrag(A.files);A.defrag=true;A.stuck=false;render();say("Disco desfragmentado: blocos usados agora ficam juntos no início. Sem bônus de “sem desfragmentar” nos próximos arquivos.");panelA()}
function rstA(){stopAuto();ask("Reiniciar a partida? O progresso será perdido.",startA)}
function guessA(){const v=+$("gs").value;if(!v)return;const foto=A.files.find(x=>x.nome==="foto.jpg"),c=cost(A.strat,foto.n),ok=v===c;if(ok){A.score+=50;petals()}
 const why={contigua:"o endereço do bloco é calculado diretamente: 1 acesso.",encadeada:"é preciso seguir os ponteiros desde o primeiro bloco: "+foto.n+" acessos.",indexada:"1 acesso ao bloco de índices + 1 ao bloco de dados = 2."}[A.strat];
 say(`${ok?"Acertou! ✔ +50":"Resposta real: "+c+"."} Na ${NOME[A.strat].toLowerCase()}, ${why}`);
 A.phase="done";resA={disk:clone(D),strat:A.strat,used:A.files.reduce((a,f)=>a+f.n+(f.idx!=null?1:0),0),cost:c,score:A.score,defrag:A.defrag};scoreUI();panelA()}
/* ---------- MODO B ---------- */
function clearLog(){for(let i=LOG0;i<N;i++)D[i]=blank(i)}
const applySub=s=>D[s.b]={id:s.b,estado:s.t==="inode"?"indice":"dados",dono:"arqA",usado:false};
function startB(){stopAuto();newDisk(false);MODE="B";B={r:0,crashes:0,ok:0,bad:0,score:0};goGame("Modo B · Journaling");newOp()}
function newOp(){const r=B.r;B.subs=[{t:"dado",b:10+3*r},{t:"dado",b:11+3*r},{t:"inode",b:r}];Object.assign(B,{lg:0,cm:false,ap:0,over:false,busy:false,useLog:true,started:false});clearLog();render();
 say(`Operação ${r+1}/3: escrever 2 blocos no arquivo A e atualizar o inode (3 suboperações). Registre no log!`);panelB()}
function panelB(){const L=B.useLog,p=$("panel"),n=B.subs.length;
 if(B.over){p.innerHTML=`<h3>Operação ${B.r+1}/3 encerrada</h3><p>Consistentes: ${B.ok} · Corrompidas: ${B.bad}</p><div class="row">${B.r<2?`<button class="pri" onclick="B.r++;newOp()">Próxima operação</button>`:`<button class="pri" onclick="finishB()">Ver resultado</button>`}<button onclick="startB()">Reiniciar</button></div>`;return}
 const d=B.busy?"disabled":"";
 p.innerHTML=`<h3>Operação ${B.r+1}/3</h3><p class="chips">${L?`log: <b>${B.lg}/${n}</b> · commit: ${B.cm?"feito":"pendente"}`:`aplicadas direto: <b>${B.ap}/${n}</b> (sem log)`}</p>
 <label class="chips"><input type="checkbox" ${L?"checked":""} ${B.started?"disabled":""} onchange="B.useLog=this.checked;panelB()"> Usar log</label>
 <div class="row">${L?`<button class="pri" ${d} ${B.cm||B.lg>=n&&n<=B.lg&&B.lg<B.subs.length?"disabled":""} onclick="regB()" ${B.cm||B.lg>=n?"disabled":""}>Registrar no log</button><button class="pri go" onclick="commitB()" ${B.lg===n&&!B.cm&&!B.busy?"":"disabled"}>Commit</button>${B.cm?`<button ${d} onclick="instB()">Concluir (instalar)</button>`:`<button ${d} onclick="extraB()">+ escrita extra</button>`}`:`<button class="pri" ${d} onclick="wrB()">Escrever direto no bloco</button>`}<button class="dng" ${d} onclick="crashB()">⚡ Simular queda agora!</button></div>
 <p class="mt">O Commit só habilita quando todas as suboperações estão no log.</p>`}
function regB(){if(B.over||B.busy||B.cm)return;B.started=true;
 if(B.lg>=4&&B.lg<B.subs.length){B.subs.splice(B.lg);say("Log cheio (4 blocos): o xv6 força commit antes de continuar (begin_op/end_op). Faça o commit.");panelB();return}
 const s=B.subs[B.lg],slot=LOG0+B.lg;D[slot]={id:slot,estado:"log",dono:s.t,usado:true};B.lg++;render([slot]);say(`Suboperação ${B.lg} gravada no log (bloco de log ${slot}).`);panelB()}
function extraB(){if(B.over||B.busy||B.cm)return;B.started=true;if(B.subs.length>=5){say("Limite de escritas por transação atingido.");return}
 B.subs.push({t:"dado",b:17+3*B.r+B.subs.length});say(`Escrita extra adicionada (${B.subs.length} suboperações). O log só comporta 4 blocos: se passar disso, ele enche.`);
 if(B.lg>=4&&B.lg<B.subs.length){regB();return}panelB()}
function commitB(){B.cm=true;B.started=true;say(`Commit gravado: cabeçalho do log registra ${B.subs.length} blocos. A operação já é durável, mesmo que a energia caia.`);panelB()}
function endB(sc,msg){B.over=true;B.busy=false;B.score+=sc;say(msg);scoreUI();panelB()}
function instB(){B.subs.forEach(applySub);clearLog();render(B.subs.map(s=>s.b));endB(20,"Operação concluída: dados nos blocos definitivos e log liberado (end_op).");B.ok++}
function wrB(){B.started=true;const s=B.subs[B.ap++];applySub(s);render([s.b]);say(`Bloco ${s.b} escrito direto no disco (${s.t==="inode"?"inode":"dados"}). Sem log, nada protege o intervalo até terminar.`);
 if(B.ap>=B.subs.length)return endB(10,"Operação concluída sem queda, por sorte. Sem log, o risco ficou o tempo todo.");panelB()}
async function crashB(){if(B.over||B.busy)return;B.started=true;B.crashes++;B.busy=true;panelB();say("⚡ QUEDA DE ENERGIA!");document.body.classList.add("flash");await sl(700);document.body.classList.remove("flash");
 if(B.useLog){
  if(!B.cm){clearLog();render();B.ok++;return endB(10,"Sem commit, o recovery ignora o log: nada foi aplicado. Disco consistente, operação perdida.")}
  say("Reiniciando… recovery lê o cabeçalho do log e encontra o commit.");await sl(900);
  for(const s of B.subs){applySub(s);render([s.b]);say(`Recovery reaplica ${s.t==="inode"?"o inode":"o dado"} no bloco ${s.b}.`);await sl(800)}
  clearLog();render();B.ok++;petals(10);return endB(25,"Log marcado como livre. Disco consistente, operação preservada.")}
 if(B.ap===0){B.ok++;return endB(5,"Nada tinha sido escrito ainda: disco consistente, mas só por sorte.")}
 for(let i=0;i<B.ap;i++)D[B.subs[i].b]={...D[B.subs[i].b],estado:"corrompido"};render(B.subs.slice(0,B.ap).map(s=>s.b));B.bad++;
 endB(0,"Sem log, a queda deixou a operação pela metade: blocos novos sem o inode e o bitmap correspondentes. Disco corrompido.")}
function finishB(){resB={disk:clone(D),crashes:B.crashes,ok:B.ok,bad:B.bad,score:B.score};showResult()}
/* ---------- SANDBOX ---------- */
function startS(){stopAuto();newDisk(true);MODE="S";S={strat:"indexada",log:true,files:[],n:0};goGame("Modo Livre");say("Aloque arquivos e simule quedas quando quiser.");panelS()}
function panelS(){$("panel").innerHTML=`<h3>Laboratório</h3><div class="row"><select onchange="S.strat=this.value">${Object.keys(NOME).map(k=>`<option value="${k}" ${S.strat===k?"selected":""}>${NOME[k]}</option>`).join("")}</select><label class="chips"><input type="checkbox" ${S.log?"checked":""} onchange="S.log=this.checked"> Log ligado</label></div><div class="row"><input id="sz" type="number" min="1" max="10" value="3" inputmode="numeric" style="width:80px" aria-label="Tamanho em blocos"><button class="pri" onclick="allocS()">Alocar arquivo</button><button class="dng" onclick="crashS()">⚡ Simular queda</button><button onclick="defragS()">Desfragmentar</button><button onclick="startS()">Resetar</button></div>`}
function allocS(){const n=Math.max(1,Math.min(10,+$("sz").value||3)),p=plan(S.strat,n),nome="arq"+(S.n+1);
 if(!p){say(`${nome} (${n} blocos) não cabe com a alocação ${NOME[S.strat].toLowerCase()}.${S.strat==="contigua"?" Tente desfragmentar.":""}`);return}
 S.n++;const st=stepsFor(S.strat,nome,p);st.forEach(x=>apply(x,nome));S.files.push({nome,n,blocks:p.blocks,idx:p.idx});render(p.blocks.concat(p.idx??[]));say(st[0].msg+" "+DICA[S.strat])}
function defragS(){defrag(S.files);render();say("Disco desfragmentado.")}
function crashS(){const f=S.files[S.files.length-1];if(!f){say("Aloque um arquivo antes de simular a queda.");return}
 if(S.log){say("⚡ Queda! O log protegeu a operação: se houve commit, o recovery reaplica; se não, descarta. Disco consistente.");return}
 const b=f.blocks[f.blocks.length-1];D[b].estado="corrompido";render([b]);say(`⚡ Queda sem log! O bloco ${b} de ${f.nome} ficou escrito sem os metadados atualizados: disco corrompido.`)}
/* ---------- RESULTADO ---------- */
function showResult(){stopAuto();show("result");petals(12);
 const dA=resA?resA.disk:null,dB=resB?resB.disk:null,e=`<p class="mt">Jogue este modo até o fim para ver o disco.</p>`;
 $("result").innerHTML=`<div class="top"><button class="ghost" onclick="toMenu()">← Menu</button><b>Resultado</b><span></span></div>
 <div class="res"><div class="card"><h3>Modo A${resA?" · "+NOME[resA.strat]:""}</h3>${dA?'<div class="disk" id="rA"></div><p class="mt">Blocos gastos: '+resA.used+" · acessos ao último bloco de foto.jpg: "+resA.cost+" · pontos: "+resA.score+"</p>":e}</div>
 <div class="card"><h3>Modo B · Journaling</h3>${dB?'<div class="disk" id="rB"></div><p class="mt">Quedas: '+resB.crashes+" · consistentes: "+resB.ok+" · corrompidas: "+resB.bad+" · pontos: "+resB.score+"</p>":e}</div></div>
 <div class="card" style="margin-top:14px"><h3>1. Qual estratégia gastou menos blocos? Qual deu acesso mais rápido?</h3><table><tr><th>Estratégia</th><th>Blocos (arquivo de 5)</th><th>Acessos ao último bloco</th></tr><tr><td>Contígua</td><td>5</td><td>1</td></tr><tr><td>Encadeada</td><td>5</td><td>5</td></tr><tr><td>Indexada</td><td>6</td><td>2</td></tr></table>
 <h3 style="margin-top:14px">2. Quantas quedas deixaram o disco consistente? Por quê?</h3><p>${resB?`${resB.ok} de ${resB.crashes} quedas deixaram o disco consistente. Com log, a queda antes do commit descarta a operação e depois do commit o recovery a reaplica; sem log, uma queda no meio corrompe.`:"Jogue o Modo B para ver sua resposta."}</p>
 <h3>3. Por que o xv6 usa indexada e log ao mesmo tempo?</h3><div class="key">A alocação indexada dá acesso direto e permite arquivos crescerem sem fragmentação externa; o log garante que as várias escritas dessa estrutura (dados, inode, bitmap) aconteçam por inteiro ou não aconteçam.</div>
 <div class="row"><button class="pri" onclick="toMenu()">Jogar de novo</button><button onclick="toMenu()">Voltar ao menu</button><button onclick="just()">Ver justificativa técnica</button></div></div>`;
 if(dA)drawDisk($("rA"),dA);if(dB)drawDisk($("rB"),dB)}
function just(){modal(`<h3>Justificativa técnica</h3><p>O jogo mostra um disco único em dois modos para ligar duas ideias: como os dados ocupam blocos (contígua, encadeada, indexada) e como o sistema mantém consistência (log transacional do xv6, <code>log.c</code>).</p><p><b>Heurísticas de Nielsen:</b></p><p>#1 Visibilidade: disco colorido, contador “log: x/y” e faixa de frase. #2 Mundo real: blocos, queda de energia, commit. #3 Controle: Pausar, Reiniciar, Menu e queda a qualquer momento. #4 Consistência: mesmo disco, cores e botões. #5 Prevenção de erros: Commit só habilita com log completo e confirmação antes de reiniciar. #6 Reconhecer: legenda fixa e painel “Saiba mais”. #7 Flexibilidade: modo guiado e Modo Livre. #8 Minimalismo: uma tela, um disco, uma faixa. #9 Diagnóstico: blocos vermelhos com explicação. #10 Ajuda: “Como jogar” e esta justificativa.</p>`)}
</script></body></html>
